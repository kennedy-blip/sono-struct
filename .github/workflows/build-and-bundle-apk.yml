name: Build & Bundle APK

# Compiles the Capacitor Android shell into a signed release APK and commits it
# to public/releases/ so the web app's one-tap download serves a real artifact.
#
# Runs on GitHub's runners because they ship a JDK 17 + Android SDK toolchain;
# the Vercel build only needs the committed APK.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/postbuild-apk.mjs'
      - '.github/workflows/build-and-bundle-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    # Pinned: GitHub's ubuntu images ship a preinstalled Android SDK, which is
    # more reliable here than bootstrapping commandline-tools over the network.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK at $SDK"
            ls -la /usr/local/lib/android || true
            exit 1
          fi
          echo "SDK root: $SDK"
          ls "$SDK"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: ${SDKMGR:-<none>}"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "--- installed platforms:"; ls "$SDK/platforms" || true
          echo "--- installed build-tools:"; ls "$SDK/build-tools" || true
          test -d "$SDK/platforms/android-34" || { echo "::error::platforms;android-34 missing"; exit 1; }

      - name: Resolve build-tools version
        id: bt
        run: |
          SDK="${ANDROID_SDK_ROOT}"
          BT="$(ls "$SDK/build-tools" | sort -V | tail -1)"
          echo "version=$BT" >> "$GITHUB_OUTPUT"
          echo "Using build-tools $BT"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor → Android
        # Not a bare `cap sync`: that would embed public/releases/*.apk into the
        # APK being built. See scripts/sync-android.mjs.
        run: npm run cap:sync

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Assemble signed release APK
        working-directory: android
        env:
          SONO_KEYSTORE_PASSWORD: sonostruct-release
          SONO_KEY_ALIAS: sonostruct
          SONO_KEY_PASSWORD: sonostruct-release
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify, hash and publish into public/releases
        run: node scripts/postbuild-apk.mjs android/app/build/outputs/apk/release/app-release.apk

      - name: Verify signature (apksigner)
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${{ steps.bt.outputs.version }}/apksigner"
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs public/releases/sonostruct-release.apk

      - name: Commit artifact
        run: |
          git config user.name  "sono-struct-apk-bot"
          git config user.email "apk-bot@users.noreply.github.com"
          # Stage the synced web bundle too, so a regenerated dist cannot leave a
          # stale (or previously nested) copy of the artifact sitting in
          # android/app/src/main/assets/public/releases/.
          git add public/releases/sonostruct-release.apk public/releases/sonostruct-release.json
          git add -A android/app/src/main/assets
          if git diff --cached --quiet; then
            echo "No APK change to commit."
          else
            SHA=$(node -p "require('./public/releases/sonostruct-release.json').sha256")
            SIZE=$(node -p "(require('./public/releases/sonostruct-release.json').sizeBytes/1048576).toFixed(2)")
            git commit -m "build(apk): signed release ${SIZE} MB [skip ci]

            sha256: ${SHA}
            built by .github/workflows/build-and-bundle-apk.yml from ${GITHUB_SHA}"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sonostruct-release-apk
          path: |
            public/releases/sonostruct-release.apk
            public/releases/sonostruct-release.json
          if-no-files-found: error
          retention-days: 30
